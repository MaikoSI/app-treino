# Verificação de todo Pull Request (e de pushes fora da main).
# A main é protegida: só aceita merge com o job "verificar" passando (scripts/proteger-main.sh).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo, para conferir as mensagens de commit do PR
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mensagens de commit (Commitlint)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint e formatação (Biome)
        run: npm run lint
      - name: Código e dependências sem uso (Knip)
        run: npm run knip
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Navegador dos testes end-to-end
        run: npx playwright install --with-deps chromium
      - name: Testes end-to-end (Playwright)
        run: npm run e2e
      - name: Relatório dos testes end-to-end
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
      - name: Build
        run: npm run build

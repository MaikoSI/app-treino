<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Registro de treinos de musculação que funciona offline." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Treino" />
    <title>Treino</title>
    <script>
      // Aplica a escolha manual de tema antes do app carregar. Sem escolha ("sistema"), o CSS segue o aparelho.
      try {
        const tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'escuro') {
          document.documentElement.dataset.theme = tema;
          document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
            m.setAttribute('content', tema === 'claro' ? '#F2F2F7' : '#000000');
          });
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

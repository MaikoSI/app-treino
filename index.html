<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="Registro de treinos de musculação que funciona offline." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Treino" />
    <title>Treino</title>
    <script>
      // Aplica o tema claro antes do app carregar (o escuro é o padrão do CSS).
      try {
        if (localStorage.getItem('tema') === 'claro') {
          document.documentElement.dataset.theme = 'claro';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F4F6F5');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
